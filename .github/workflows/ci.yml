name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build

  dns:
    name: DNS checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dns

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: dns/go.mod
          cache-dependency-path: |
            dns/go.mod
            dns/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following Go files need formatting:"
            echo "$files"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Build DNS service
        run: |
          mkdir -p bin
          go build \
            -trimpath \
            -o bin/homedns-dns \
            ./cmd/homedns-dns

      - name: Build Linux ARM64 DNS service
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: |
          mkdir -p bin
          go build \
            -trimpath \
            -o bin/homedns-dns-linux-arm64 \
            ./cmd/homedns-dns

      - name: Inspect build artifacts
        run: |
          ls -lh bin
          file bin/homedns-dns
          file bin/homedns-dns-linux-arm64